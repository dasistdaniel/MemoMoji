<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MemoMoji</title>
<style>
  :root {
    --bg: #e9eff5;
    --fg: #1a1f26;
    --muted: #5d6673;
    --panel: #ffffffee;
    --accent: #ff7a1a;
    --line: #1a1f2622;
    --board: #f8fafc;
    --shadow: 0 10px 40px #1a1f2622;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14171c;
      --fg: #eef1f5;
      --muted: #9aa3ae;
      --panel: #232830ee;
      --line: #eef1f526;
      --board: #1d2129;
      --shadow: 0 10px 40px #0008;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171c;
    --fg: #eef1f5;
    --muted: #9aa3ae;
    --panel: #232830ee;
    --line: #eef1f526;
    --board: #1d2129;
    --shadow: 0 10px 40px #0008;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  #hud {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    display: flex; gap: 18px; align-items: center;
    padding: 8px 18px; border-radius: 999px;
    background: var(--panel); box-shadow: var(--shadow);
    font-variant-numeric: tabular-nums; font-size: 18px; white-space: nowrap;
    pointer-events: none;
  }
  #hud b { font-weight: 700; }
  #hud .sel { font-size: 24px; min-width: 28px; text-align: center; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; cursor: default; }
  #hud .rot {
    pointer-events: auto; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    font-size: 20px; line-height: 1; background: transparent; color: var(--fg);
    box-shadow: inset 0 0 0 2px var(--line);
  }
  #hud .rot:hover { background: var(--line); filter: none; }
  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #0004; backdrop-filter: blur(3px);
  }
  .overlay[hidden] { display: none; }
  .card {
    background: var(--panel); box-shadow: var(--shadow);
    border-radius: 20px; padding: 28px 32px; text-align: center;
    max-width: min(420px, calc(100vw - 32px));
  }
  .card h1 { margin: 0 0 6px; font-size: 34px; }
  .card p { margin: 6px 0 18px; color: var(--muted); line-height: 1.4; }
  .levels { display: grid; gap: 10px; }
  button {
    font: inherit; font-size: 17px; cursor: pointer;
    border: 0; border-radius: 12px; padding: 12px 18px;
    background: var(--accent); color: #fff; font-weight: 600;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  button small { font-weight: 400; opacity: .85; }
  button.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 12px; }
  .tabs button { padding: 6px 12px; font-size: 15px; }
  .tabs button[aria-pressed="false"] { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); }
  ol.scores {
    list-style: none; margin: 0 0 16px; padding: 0; text-align: left;
    font-variant-numeric: tabular-nums; min-width: min(300px, 70vw);
  }
  ol.scores li { display: flex; gap: 10px; padding: 5px 4px; border-bottom: 1px solid var(--line); }
  ol.scores li:last-child { border-bottom: 0; }
  ol.scores .rank { width: 2ch; color: var(--muted); text-align: right; }
  ol.scores .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.scores li.me { color: var(--accent); font-weight: 700; }
  ol.scores li.empty { color: var(--muted); justify-content: center; border: 0; }
  form.submit { display: flex; gap: 8px; margin: 0 0 16px; }
  form.submit input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px;
    border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--fg);
    user-select: text; -webkit-user-select: text;
  }
  form.submit input:focus { outline: none; border-color: var(--accent); }
  .msg { min-height: 1.2em; }
  .card .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .big { font-size: 44px; font-weight: 800; margin: 8px 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <button class="rot" id="rotL" title="Spielfeld nach links drehen (←)" aria-label="Spielfeld nach links drehen">⟲</button>
  <span>⏱ <b id="time">0.0</b>s</span>
  <span>🧩 <b id="left">0</b></span>
  <span class="sel" id="sel"></span>
  <button class="rot" id="rotR" title="Spielfeld nach rechts drehen (→)" aria-label="Spielfeld nach rechts drehen">⟳</button>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>🎲 MemoMoji</h1>
    <p>Die Emojis purzeln herunter. Klicke immer zwei <b>gleiche</b> an, um sie verschwinden zu lassen. Räum alles ab – so schnell du kannst!</p>
    <div class="levels" id="levels"></div>
    <p class="actions" style="margin:12px 0 0"><button class="ghost" id="boardBtn" hidden>🏆 Bestenliste</button></p>
  </div>
</div>

<div class="overlay" id="board" hidden>
  <div class="card">
    <h1>🏆 Bestenliste</h1>
    <div class="tabs" id="boardTabs"></div>
    <ol class="scores" id="boardList"></ol>
    <button id="boardClose">Zurück</button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="card">
    <h1>🎉 Geschafft!</h1>
    <div class="big" id="winTime"></div>
    <p id="winBest"></p>
    <form class="submit" id="submitForm" hidden>
      <input id="nameInput" maxlength="20" placeholder="Dein Name" autocomplete="nickname" aria-label="Dein Name für die Bestenliste">
      <button type="submit">Eintragen</button>
    </form>
    <p class="msg" id="submitMsg" hidden></p>
    <ol class="scores" id="winList" hidden></ol>
    <button id="again">Nochmal spielen</button>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
(() => {
  "use strict";

  // ---------- Konfiguration ----------
  const LEVELS = [
    { name: "Leicht",  pairs: 40 },
    { name: "Mittel",  pairs: 75 },
    { name: "Schwer",  pairs: 110 },
  ];

  const EMOJI_STRING = "😀😂🥹😍🤩😎🥳😡🥶🤢👻💀👽🤖🎃😺🙈🐶🐱🐭🐹🐰🦊🐻🐼🐨🐯🦁🐮🐷🐸🐵🐔🐧🐦🦆🦉🦇🐺🐗🐴🦄🐝🐛🦋🐌🐞🐢🐍🦖🐙🦑🦀🐡🐠🐬🐳🦈🐊🦓🦒🐘🦔🌵🌲🌴🍀🍁🍄🌷🌹🌻🌈⭐🌙☀️⚡🔥❄️💧🍎🍐🍊🍋🍌🍉🍇🍓🫐🍒🍑🥭🍍🥥🥝🍅🍆🥑🥦🌶️🌽🥕🥐🍞🧀🍔🍟🍕🌭🌮🍩🍪🎂🍭🍫🍿🧃☕⚽🏀🏈⚾🎾🏐🎱🏓🎯🎮🎲🧩🎸🎺🥁🚗🚕🚓🚑🚒🚜🚲🛵🚀🛸🚁⛵⚓🏠🏰🗽🎁🎈🎀💎🔔🔑🔒💡📚✏️📌✂️🧲🧪💊🪀🪁🧸👑🎩👓🧦👟💍❤️💜💚💙💛🧡🖤";
  // In einzelne Emojis zerlegen (inkl. Varianten-Selektoren wie bei ❤️)
  const EMOJI_LIST = [...new Set(
    typeof Intl !== "undefined" && Intl.Segmenter
      ? [...new Intl.Segmenter().segment(EMOJI_STRING)].map(s => s.segment)
      : [...EMOJI_STRING].filter(c => c !== "\uFE0F")
  )];

  // Das Spielfeld ist eine feste "Welt" im Handy-Format. Sie wird auf den
  // Bildschirm skaliert, damit das Spiel überall gleich ist.
  const WORLD_W = 400, WORLD_H = 760;
  const R = 14;              // Radius eines Emojis in Welt-Einheiten, immer gleich
  const GRAVITY = 2200;      // Welt-Einheiten/s²
  const SUBSTEPS = 8;
  const ITERATIONS = 2;
  const DAMPING = 0.995;
  const RESTITUTION_WALL = 0.2;
  const FLOOR_FRICTION = 0.85;
  const DROP_DELAY = 900;    // ms, die Emojis schweben kurz in der Mitte
  const ROTATE_MS = 650;     // Dauer der Drehanimation

  // ---------- Setup ----------
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const finePointer = matchMedia("(pointer: fine)").matches;
  let SW = 0, SH = 0, DPR = 1;       // Bildschirmgröße in CSS-Pixeln
  let bodies = [];
  let colors = { board: "#fff", line: "#0002" };

  // Ansicht: Drehwinkel (Bogenmaß, im Uhrzeigersinn) und Skalierung
  const view = { angle: 0, from: 0, target: 0, t0: 0, scale: 1, cx: 0, cy: 0 };
  const rotating = () => view.angle !== view.target;
  // Nach dem Drehen noch kurz wach bleiben, damit der Haufen ausfließen kann
  const settling = () => rotating() || performance.now() < view.t0 + ROTATE_MS + 1500;
  const quarterTurns = a => ((Math.round(a / (Math.PI / 2)) % 4) + 4) % 4;

  function fitScale(angle) {
    const c = Math.abs(Math.cos(angle)), si = Math.abs(Math.sin(angle));
    const bw = c * WORLD_W + si * WORLD_H, bh = si * WORLD_W + c * WORLD_H;
    // Am Desktop Rand lassen und oben Platz für die Anzeige
    const pad = finePointer ? 16 : 0, top = finePointer ? 64 : 0;
    return Math.min((SW - 2 * pad) / bw, (SH - top - pad) / bh);
  }

  function updateView(now) {
    if (rotating()) {
      const k = Math.min(1, (now - view.t0) / ROTATE_MS);
      const e = k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
      view.angle = k >= 1 ? view.target : view.from + (view.target - view.from) * e;
    }
    const top = finePointer ? 64 : 0, pad = finePointer ? 16 : 0;
    // Desktop: gleiche Größe in jeder Lage, das Feld dreht sich ohne Zoom.
    // Handy: der Bildschirm dreht sich mit, also passend zur aktuellen Lage.
    view.scale = finePointer ? Math.min(fitScale(0), fitScale(Math.PI / 2)) : fitScale(view.target);
    view.cx = SW / 2;
    view.cy = top + (SH - top - pad) / 2;
  }

  function rotateBoard(dir) {
    if (state !== "play" && state !== "hover") return;
    view.from = view.angle;
    view.target += dir * Math.PI / 2;
    view.t0 = performance.now();
    for (const b of bodies) wake(b);
  }

  function toWorld(x, y) {
    const dx = x - view.cx, dy = y - view.cy;
    const c = Math.cos(view.angle), si = Math.sin(view.angle);
    return [(c * dx + si * dy) / view.scale + WORLD_W / 2, (-si * dx + c * dy) / view.scale + WORLD_H / 2];
  }
  function toScreen(x, y) {
    const dx = (x - WORLD_W / 2) * view.scale, dy = (y - WORLD_H / 2) * view.scale;
    const c = Math.cos(view.angle), si = Math.sin(view.angle);
    return [view.cx + c * dx - si * dy, view.cy + si * dx + c * dy];
  }

  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    colors = { board: cs.getPropertyValue("--board").trim(), line: cs.getPropertyValue("--line").trim() };
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", readColors);

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    SW = window.innerWidth; SH = window.innerHeight;
    canvas.width = Math.round(SW * DPR);
    canvas.height = Math.round(SH * DPR);
    fx.width = canvas.width; fx.height = canvas.height;
    // Handy: Beim Drehen des Geräts dreht sich das Spielfeld mit,
    // die Emojis fallen dann zur neuen Unterseite.
    if (!finePointer) {
      const landscape = SW > SH;
      if (landscape !== (quarterTurns(view.target) % 2 === 1)) {
        const oa = screen.orientation ? screen.orientation.angle : window.orientation;
        view.angle = view.target = view.from = landscape ? (oa === 270 || oa === -90 ? 1 : -1) * Math.PI / 2 : 0;
        view.t0 = performance.now() - ROTATE_MS;
        for (const b of bodies) wake(b);
      }
    }
    // Sprites in der Auflösung der größten möglichen Darstellung
    const res = Math.ceil(R * 2.3 * (finePointer ? Math.min(fitScale(0), fitScale(Math.PI / 2)) : Math.max(fitScale(0), fitScale(Math.PI / 2))) * DPR);
    if (res !== spriteRes) { spriteRes = res; sprites.clear(); }
    readColors();
  }
  window.addEventListener("resize", resize);

  // Emoji-Sprites vorrendern (viel schneller als fillText pro Frame)
  const sprites = new Map();
  let spriteRes = 0;
  function sprite(emoji) {
    let s = sprites.get(emoji);
    if (s) return s;
    const size = spriteRes;
    s = document.createElement("canvas");
    s.width = s.height = size;
    const g = s.getContext("2d");
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = `${Math.floor(size * 0.76)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    g.fillText(emoji, size / 2, size / 2 + size * 0.045);
    sprites.set(emoji, s);
    return s;
  }

  // ---------- Spielzustand ----------
  let popping = [];
  let selected = null;
  let state = "menu";   // menu | hover | play | won
  let startTime = 0, dropAt = 0, elapsed = 0;
  let level = LEVELS[0];

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = (Math.random() * (i + 1)) | 0;
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function newGame(lvl) {
    level = lvl;
    const n = lvl.pairs * 2;

    // Emoji-Typen auswählen; bei vielen Paaren kommen Typen mehrfach (immer paarweise) vor
    const types = shuffle([...EMOJI_LIST]);
    const deck = [];
    for (let i = 0; i < lvl.pairs; i++) {
      const e = types[i % types.length];
      deck.push(e, e);
    }
    shuffle(deck);

    // Mittig als kompakter Block anordnen
    const d = R * 2.02;
    const cols = Math.max(1, Math.min(Math.floor((WORLD_W * 0.85) / d), Math.ceil(Math.sqrt(n * 1.3))));
    const rows = Math.ceil(n / cols);
    const x0 = WORLD_W / 2 - (cols - 1) * d / 2;
    const y0 = WORLD_H / 2 - (rows - 1) * d / 2;
    bodies = deck.map((emoji, i) => {
      const cx = x0 + (i % cols) * d + (Math.random() - 0.5) * 2;
      const cy = y0 + Math.floor(i / cols) * d + (Math.random() - 0.5) * 2;
      return {
        emoji, x: cx, y: cy,
        // kleiner Anfangsimpuls für ein natürliches Auseinanderfallen
        px: cx - (Math.random() - 0.5) * 0.12,
        py: cy - (Math.random() - 0.5) * 0.12,
        rot: (Math.random() - 0.5) * 0.6,
        spin: 0, sleep: false, still: 0,
      };
    });
    popping = [];
    selected = null;
    state = "hover";
    dropAt = performance.now() + DROP_DELAY;
    elapsed = 0;
    $("menu").hidden = true;
    $("win").hidden = true;
    $("hud").hidden = false;
    for (const id of ["rotL", "rotR"]) $(id).hidden = !finePointer;
    stopConfetti();
    updateHud();
  }

  // ---------- Physik (Verlet + Kreis-Kollision mit Raster) ----------
  // Ruhende Emojis "schlafen": Sie bewegen sich nicht mehr und wirken für
  // andere wie feste Körper. So zittert der Haufen nicht. Sie wachen auf,
  // sobald ihnen der Halt fehlt, sie angestoßen werden oder das Feld sich dreht.
  const SLEEP_MOVE = 0.25;   // Einheiten pro Frame, darunter gilt ein Emoji als ruhig
  const SLEEP_FRAMES = 15;   // so viele ruhige Frames bis zum Einschlafen

  const grid = new Map();
  const cellKey = (gx, gy) => (gx * 73856093) ^ (gy * 19349663);
  function buildGrid(cell) {
    grid.clear();
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      const k = cellKey((b.x / cell) | 0, (b.y / cell) | 0);
      let arr = grid.get(k);
      if (!arr) grid.set(k, arr = []);
      arr.push(i);
    }
  }
  function forNeighbors(b, cell, fn) {
    const gx = (b.x / cell) | 0, gy = (b.y / cell) | 0;
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const arr = grid.get(cellKey(gx + ox, gy + oy));
      if (arr) for (const j of arr) fn(j);
    }
  }
  function wake(b) { b.sleep = false; b.still = 0; }

  // Die vier Wände: Normale nach außen, und wie weit ein Emoji noch entfernt ist
  const WALLS = [
    { nx: 0, ny: 1, dist: b => WORLD_H - R - b.y },
    { nx: 0, ny: -1, dist: b => b.y - R },
    { nx: 1, ny: 0, dist: b => WORLD_W - R - b.x },
    { nx: -1, ny: 0, dist: b => b.x - R },
  ];

  function step(dt) {
    const h = dt / SUBSTEPS;
    const g = state === "hover" ? 0 : GRAVITY;
    // Schwerkraft zeigt auf dem Bildschirm immer nach unten, in der Welt also gedreht
    const ux = Math.sin(view.angle), uy = Math.cos(view.angle);
    const gx = g * ux * h * h, gy = g * uy * h * h;
    const r = R, d = r * 2, d2 = d * d;
    const cell = d;
    const maxV = r * 0.35;

    for (const b of bodies) { b.fx = b.x; b.fy = b.y; }

    for (let s = 0; s < SUBSTEPS; s++) {
      // Integration
      for (const b of bodies) {
        if (b.sleep) continue;
        let vx = (b.x - b.px) * DAMPING;
        let vy = (b.y - b.py) * DAMPING;
        // Geschwindigkeit begrenzen, damit Überlappungen nicht "explodieren"
        const v = Math.hypot(vx, vy);
        if (v > maxV) { vx *= maxV / v; vy *= maxV / v; }
        b.px = b.x; b.py = b.y;
        b.x += vx + gx;
        b.y += vy + gy;
        b.rot += b.spin * h;
        b.spin *= 0.99;
      }

      for (let it = 0; it < ITERATIONS; it++) {
        buildGrid(cell);
        // Kollisionen Kreis/Kreis
        for (let i = 0; i < bodies.length; i++) {
          const a = bodies[i];
          forNeighbors(a, cell, j => {
            if (j <= i) return;
            const b = bodies[j];
            if (a.sleep && b.sleep) return;
            let dx = b.x - a.x, dy = b.y - a.y;
            const dist2 = dx * dx + dy * dy;
            if (dist2 >= d2) return;
            let dist = Math.sqrt(dist2);
            if (dist < 1e-6) { dx = Math.random() - 0.5; dy = -1; dist = Math.hypot(dx, dy); }
            const corr = (d - dist) / dist;
            // Schlafende Emojis sind unbeweglich, der wache Partner weicht ganz aus
            const wa = a.sleep ? 0 : b.sleep ? 1 : 0.5;
            const wb = 1 - wa;
            a.x -= dx * corr * wa; a.y -= dy * corr * wa;
            b.x += dx * corr * wb; b.y += dy * corr * wb;
          });
        }
        // Wände: abprallen, und Reibung auf der Wand, die gerade "Boden" ist
        for (const b of bodies) {
          if (b.sleep) continue;
          for (const w of WALLS) {
            const pen = -w.dist(b);
            if (pen <= 0) continue;
            b.x -= w.nx * pen; b.y -= w.ny * pen;
            const vx = b.x - b.px, vy = b.y - b.py;
            const vn = vx * w.nx + vy * w.ny;            // in die Wand hinein
            const tx = -w.ny, ty = w.nx;
            let vt = vx * tx + vy * ty;                   // entlang der Wand
            const isFloor = w.nx * ux + w.ny * uy > 0.5;
            if (isFloor) {
              vt *= FLOOR_FRICTION;
              if (Math.abs(vt) > 0.05) b.spin = vt / r / h * 0.5;
            }
            const nvn = vn > 0 ? -vn * RESTITUTION_WALL : vn;
            const nvx = w.nx * nvn + tx * vt, nvy = w.ny * nvn + ty * vt;
            b.px = b.x - nvx; b.py = b.y - nvy;
          }
        }
      }
    }

    if (g > 0) updateSleep(ux, uy);
  }

  function updateSleep(ux, uy) {
    const r = R, d = r * 2, reach2 = (d * 1.08) ** 2, cell = d;
    const px = -uy, py = ux;    // quer zur Schwerkraft
    if (settling()) { for (const b of bodies) wake(b); return; }
    buildGrid(cell);
    for (const b of bodies) {
      if (b.sleep) {
        // Hat das schlafende Emoji noch Halt? (Boden, Wand oder Nachbarn darunter)
        let under = false, left = false, right = false;
        for (const w of WALLS) {
          if (w.dist(b) > 1) continue;
          const down = w.nx * ux + w.ny * uy;
          if (down > 0.5) under = true;
          else if (down > -0.5) (w.nx * px + w.ny * py < 0 ? (left = true) : (right = true));
        }
        if (!under) forNeighbors(b, cell, j => {
          const o = bodies[j];
          if (o === b) return;
          const dx = o.x - b.x, dy = o.y - b.y;
          if (dx * ux + dy * uy <= r * 0.2 || dx * dx + dy * dy > reach2) return;
          const across = dx * px + dy * py;
          if (Math.abs(across) < r * 0.35) under = true;
          else if (across < 0) left = true;
          else right = true;
        });
        if (!(under || (left && right))) wake(b);
      } else {
        const moved = Math.hypot(b.x - b.fx, b.y - b.fy);
        b.still = moved < SLEEP_MOVE ? b.still + 1 : 0;
        if (b.still >= SLEEP_FRAMES) {
          b.sleep = true;
          b.px = b.x; b.py = b.y;
          b.spin = 0;
        }
      }
    }
  }

  // ---------- Eingabe ----------
  canvas.addEventListener("pointerdown", e => {
    if (state !== "play" && state !== "hover") return;
    const [x, y] = toWorld(e.clientX, e.clientY);
    let best = null, bestD = (R * (e.pointerType === "touch" ? 1.5 : 1.1)) ** 2;
    for (const b of bodies) {
      const dd = (b.x - x) ** 2 + (b.y - y) ** 2;
      if (dd < bestD) { bestD = dd; best = b; }
    }
    if (!best) return;

    if (!selected) {
      selected = best;
    } else if (selected === best) {
      selected = null;
    } else if (selected.emoji === best.emoji) {
      remove(selected); remove(best);
      selected = null;
      if (bodies.length === 0) win();
    } else {
      // falsches Paar: neue Auswahl, kleines Wackeln als Feedback
      shake(selected); shake(best);
      selected = best;
    }
    updateHud();
  });

  $("rotL").onclick = () => rotateBoard(-1);
  $("rotR").onclick = () => rotateBoard(1);
  window.addEventListener("keydown", e => {
    if (e.target instanceof HTMLInputElement) return;
    if (e.key === "ArrowLeft" || e.key === "q") rotateBoard(-1);
    else if (e.key === "ArrowRight" || e.key === "e") rotateBoard(1);
  });

  function shake(b) {
    wake(b);
    b.px = b.x + (Math.random() - 0.5) * 6;
    b.py = b.y + (Math.random() - 0.5) * 6;
  }

  function remove(b) {
    bodies.splice(bodies.indexOf(b), 1);
    popping.push({ emoji: b.emoji, x: b.x, y: b.y, rot: b.rot, t: 0 });
    // Nachbarn einen kleinen Stoß geben
    for (const o of bodies) {
      const dx = o.x - b.x, dy = o.y - b.y, dd = dx * dx + dy * dy;
      const RR = R * 4;
      if (dd < RR * RR && dd > 0) {
        wake(o);
        const f = (1 - Math.sqrt(dd) / RR) * 2.5 / Math.sqrt(dd);
        o.px -= dx * f; o.py -= dy * f;
      }
    }
  }

  // ---------- Konfetti ----------
  const fx = $("fx");
  const fxCtx = fx.getContext("2d");
  const CONFETTI_COLORS = ["#ff7a1a", "#ffd23f", "#3bceac", "#0ead69", "#ee4266", "#8e5fd8", "#4d9de0"];
  let confetti = [];
  function startConfetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    confetti = [];
    const n = Math.min(260, Math.round(SW * SH / 5000) + 80);
    for (let i = 0; i < n; i++) {
      const fromLeft = i % 2 === 0;
      const ang = (fromLeft ? 1 : -1) * (0.25 + Math.random() * 0.45) - Math.PI / 2;
      const speed = (0.9 + Math.random() * 0.8) * Math.max(SH, 500) * 1.35;
      confetti.push({
        x: fromLeft ? -10 : SW + 10, y: SH * (0.75 + Math.random() * 0.2),
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed,
        w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
        rot: Math.random() * 6.3, vr: (Math.random() - 0.5) * 14,
        flip: Math.random() * 6.3, vf: 6 + Math.random() * 10,
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        delay: Math.random() * 0.35,
      });
    }
  }
  function stopConfetti() {
    confetti = [];
    fxCtx.setTransform(1, 0, 0, 1, 0, 0);
    fxCtx.clearRect(0, 0, fx.width, fx.height);
  }
  function drawConfetti(dt) {
    if (!confetti.length) return;
    fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fxCtx.clearRect(0, 0, SW, SH);
    for (const c of confetti) {
      if (c.delay > 0) { c.delay -= dt; continue; }
      c.vy += 1400 * dt;
      c.vx *= 0.985; c.vy *= 0.985;
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.rot += c.vr * dt; c.flip += c.vf * dt;
      fxCtx.save();
      fxCtx.translate(c.x, c.y);
      fxCtx.rotate(c.rot);
      fxCtx.scale(1, Math.cos(c.flip));
      fxCtx.fillStyle = c.color;
      fxCtx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      fxCtx.restore();
    }
    confetti = confetti.filter(c => c.y < SH + 40);
    if (!confetti.length) stopConfetti();
  }

  // ---------- Gemeinsame Bestenliste (nur wenn der Server erreichbar ist) ----------
  // Wird index.html direkt geöffnet, bleibt online = false und es gibt nur lokale Bestzeiten.
  let online = false;
  let gameId = null, gameSeq = 0;

  async function api(path, body) {
    const res = await fetch("api/" + path, body === undefined ? {} : {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Server nicht erreichbar");
    return data;
  }

  if (location.protocol === "http:" || location.protocol === "https:") {
    api("health").then(d => { online = !!d.ok; $("boardBtn").hidden = !online; }).catch(() => {});
  }

  function startOnlineGame() {
    gameId = null;
    const seq = ++gameSeq;
    if (!online) return;
    api("games", { level: level.pairs })
      .then(d => { if (seq === gameSeq) gameId = d.id; })
      .catch(() => {});
  }

  function renderScores(ol, scores, highlight) {
    ol.replaceChildren();
    if (!scores.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Noch keine Einträge – sei die erste Person!";
      ol.append(li);
    }
    scores.forEach((s, i) => {
      const li = document.createElement("li");
      if (highlight && s.name.toLowerCase() === highlight.toLowerCase()) li.className = "me";
      const rank = document.createElement("span"); rank.className = "rank"; rank.textContent = i + 1;
      const who = document.createElement("span"); who.className = "who"; who.textContent = s.name;
      const t = document.createElement("span"); t.textContent = fmt(s.ms) + " s";
      li.append(rank, who, t);
      ol.append(li);
    });
    ol.hidden = false;
  }

  function savedName() { try { return localStorage.getItem("memomoji-name") || ""; } catch { return ""; } }

  async function finishOnlineGame() {
    const form = $("submitForm"), msg = $("submitMsg");
    form.hidden = true; msg.hidden = true; $("winList").hidden = true;
    if (!online || !gameId) return;
    const id = gameId;
    try {
      const d = await api(`games/${id}/finish`, {});
      if (!d.valid) return;
      $("nameInput").value = savedName();
      form.hidden = false;
      form.onsubmit = async ev => {
        ev.preventDefault();
        const name = $("nameInput").value.trim();
        if (!name) { $("nameInput").focus(); return; }
        form.querySelector("button").disabled = true;
        try {
          const r = await api("scores", { id, name });
          try { localStorage.setItem("memomoji-name", r.name); } catch {}
          form.hidden = true;
          msg.textContent = `Platz ${r.rank} auf „${level.name}“ mit ${fmt(r.ms)} s`;
          msg.hidden = false;
          renderScores($("winList"), r.scores, r.name);
        } catch (e) {
          msg.textContent = e.message;
          msg.hidden = false;
        } finally {
          form.querySelector("button").disabled = false;
        }
      };
    } catch {}
  }

  let boardLevel = LEVELS[1];
  async function showBoard(lvl) {
    boardLevel = lvl;
    const tabs = $("boardTabs");
    tabs.replaceChildren(...LEVELS.map(l => {
      const b = document.createElement("button");
      b.textContent = l.name;
      b.setAttribute("aria-pressed", String(l === lvl));
      b.onclick = () => showBoard(l);
      return b;
    }));
    $("menu").hidden = true;
    $("board").hidden = false;
    const ol = $("boardList");
    try {
      const d = await api("scores?level=" + lvl.pairs);
      if (boardLevel === lvl) renderScores(ol, d.scores, savedName());
    } catch (e) {
      ol.replaceChildren(Object.assign(document.createElement("li"), { className: "empty", textContent: e.message }));
    }
  }
  $("boardBtn").onclick = () => showBoard(boardLevel);
  $("boardClose").onclick = () => { $("board").hidden = true; $("menu").hidden = false; };

  // ---------- Ablauf ----------
  function fmt(ms) { return (ms / 1000).toFixed(1); }

  function updateHud() {
    $("left").textContent = bodies.length / 2 | 0;
    $("sel").textContent = selected ? selected.emoji : "";
  }

  function bestKey() { return "memomoji-best-" + level.pairs; }
  function getBest() {
    try { const v = parseFloat(localStorage.getItem(bestKey())); return isFinite(v) ? v : null; }
    catch { return null; }
  }

  function win() {
    state = "won";
    elapsed = performance.now() - startTime;
    const prev = getBest();
    const isBest = prev === null || elapsed < prev;
    if (isBest) { try { localStorage.setItem(bestKey(), String(elapsed)); } catch {} }
    $("winTime").textContent = fmt(elapsed) + " s";
    $("winBest").textContent = isBest
      ? (prev === null ? `Erste Bestzeit auf „${level.name}“!` : `Neue Bestzeit! (vorher ${fmt(prev)} s)`)
      : `Bestzeit auf „${level.name}“: ${fmt(prev)} s`;
    finishOnlineGame();
    startConfetti();
    setTimeout(() => { $("win").hidden = false; }, 600);
  }

  function showMenu() {
    state = "menu";
    const box = $("levels");
    box.innerHTML = "";
    for (const lvl of LEVELS) {
      const btn = document.createElement("button");
      const prevLevel = level; level = lvl;
      const best = getBest();
      level = prevLevel;
      btn.innerHTML = `${lvl.name} <small>· ${lvl.pairs * 2} Emojis${best !== null ? ` · 🏆 ${fmt(best)} s` : ""}</small>`;
      btn.onclick = () => newGame(lvl);
      box.appendChild(btn);
    }
    $("win").hidden = true;
    $("hud").hidden = true;
    $("menu").hidden = false;
    stopConfetti();
  }
  $("again").onclick = showMenu;

  // ---------- Zeichnen ----------
  function roundRect(c, x, y, w, h, rad) {
    c.beginPath();
    c.moveTo(x + rad, y);
    c.arcTo(x + w, y, x + w, y + h, rad);
    c.arcTo(x + w, y + h, x, y + h, rad);
    c.arcTo(x, y + h, x, y, rad);
    c.arcTo(x, y, x + w, y, rad);
    c.closePath();
  }

  function draw(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, SW, SH);
    ctx.translate(view.cx, view.cy);
    ctx.rotate(view.angle);
    ctx.scale(view.scale, view.scale);
    ctx.translate(-WORLD_W / 2, -WORLD_H / 2);

    // Spielfeld
    roundRect(ctx, 0, 0, WORLD_W, WORLD_H, 18);
    ctx.fillStyle = colors.board;
    ctx.fill();
    ctx.lineWidth = 1.5 / view.scale;
    ctx.strokeStyle = colors.line;
    ctx.stroke();

    const r = R;
    const size = r * 2 * 1.15;
    // Emojis bleiben auf dem Bildschirm aufrecht, auch wenn das Feld gedreht ist
    const upright = -view.angle;

    for (const b of bodies) {
      const sp = sprite(b.emoji);
      ctx.save();
      ctx.translate(b.x, b.y);
      if (b === selected) {
        const pulse = 1 + Math.sin(now / 120) * 0.06;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.08 * pulse, 0, Math.PI * 2);
        ctx.fillStyle = "#ff7a1a55";
        ctx.fill();
        ctx.lineWidth = 2.5 / view.scale;
        ctx.strokeStyle = "#ff7a1a";
        ctx.stroke();
        ctx.scale(1.12 * pulse, 1.12 * pulse);
      }
      ctx.rotate(b.rot + upright);
      ctx.drawImage(sp, -size / 2, -size / 2, size, size);
      ctx.restore();
    }

    for (const p of popping) {
      const k = p.t;
      const sp = sprite(p.emoji);
      ctx.save();
      ctx.globalAlpha = 1 - k;
      // nach oben auf dem Bildschirm wegschweben
      ctx.translate(p.x - Math.sin(view.angle) * k * 30, p.y - Math.cos(view.angle) * k * 30);
      ctx.rotate(p.rot + upright + k * 2);
      const s = size * (1 + k * 1.2);
      ctx.drawImage(sp, -s / 2, -s / 2, s, s);
      ctx.restore();
    }
  }

  // ---------- Schleife ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(1 / 30, (now - last) / 1000);
    last = now;

    if (state === "hover" && now >= dropAt) {
      state = "play";
      startOnlineGame();
      startTime = now;
    }
    updateView(now);
    if (state !== "menu") step(dt);

    for (const p of popping) p.t += dt * 2.5;
    popping = popping.filter(p => p.t < 1);

    if (state === "play") $("time").textContent = fmt(now - startTime);
    else if (state === "hover") $("time").textContent = "0.0";

    draw(now);
    drawConfetti(dt);
    requestAnimationFrame(frame);
  }

  resize();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
