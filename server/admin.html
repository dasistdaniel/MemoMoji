<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MemoMoji Admin</title>
<style>
  :root {
    --bg: #e9eff5;
    --fg: #1a1f26;
    --muted: #5d6673;
    --panel: #ffffff;
    --accent: #ff7a1a;
    --danger: #d33a2c;
    --line: #1a1f2622;
    --shadow: 0 10px 40px #1a1f2622;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #14171c;
      --fg: #eef1f5;
      --muted: #9aa3ae;
      --panel: #232830;
      --danger: #ff6b5e;
      --line: #eef1f526;
      --shadow: 0 10px 40px #0008;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 16px;
    padding: 24px 16px;
  }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; }
  .card { background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 20px; }
  .muted { color: var(--muted); }
  button, input {
    font: inherit; border-radius: 10px; padding: 9px 14px;
  }
  button { border: 0; cursor: pointer; background: var(--accent); color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); }
  button.danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 2px var(--danger); padding: 5px 10px; font-size: 14px; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input { border: 2px solid var(--line); background: var(--bg); color: var(--fg); min-width: 0; }
  form.login { display: grid; gap: 12px; max-width: 340px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input { flex: 1; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button[aria-pressed="false"] { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px var(--line); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  td.name { white-space: normal; overflow-wrap: anywhere; min-width: 8ch; width: 100%; }
  @media (max-width: 560px) { .date { display: none; } th, td { padding: 8px 4px; } }
  td.num, th.num { text-align: right; }
  .msg { min-height: 1.3em; margin: 0; }
  .msg.err { color: var(--danger); }
</style>
</head>
<body>
<main>
  <header>
    <h1>🎲 MemoMoji Admin</h1>
    <button class="ghost" id="logout" hidden>Abmelden</button>
  </header>

  <section class="card" id="loginCard">
    <form class="login" id="loginForm">
      <label for="pw">Admin-Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
      <p class="msg err" id="loginMsg"></p>
    </form>
  </section>

  <section class="card" id="adminCard" hidden>
    <div style="display:grid; gap:14px">
      <div class="tabs" id="tabs"></div>
      <div class="row">
        <input id="filter" placeholder="Nach Name filtern" aria-label="Nach Name filtern">
        <button class="danger" id="deleteName" disabled>Alle Einträge dieses Namens löschen</button>
      </div>
      <p class="msg" id="msg"></p>
      <div class="tablewrap">
        <table>
          <thead><tr><th class="num">#</th><th>Name</th><th class="num">Zeit</th><th class="date">Datum</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  "use strict";
  const LEVELS = [
    { name: "Leicht", pairs: 40 },
    { name: "Mittel", pairs: 100 },
    { name: "Schwer", pairs: 175 },
  ];
  const $ = id => document.getElementById(id);
  let token = null;
  try { token = sessionStorage.getItem("memomoji-admin"); } catch {}
  let level = LEVELS[0];
  let scores = [];

  // Relativ zur Admin-Seite, funktioniert also auch hinter einem Unterpfad
  const base = location.pathname.endsWith("/") ? "../" : "";

  async function api(path, opts = {}) {
    const res = await fetch(base + "api/admin/" + path, {
      method: opts.method || "GET",
      headers: {
        ...(token ? { Authorization: "Bearer " + token } : {}),
        ...(opts.body ? { "Content-Type": "application/json" } : {}),
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "login") { setToken(null); showLogin("Sitzung abgelaufen, bitte neu anmelden."); }
    if (!res.ok) throw new Error(data.error || "Server nicht erreichbar");
    return data;
  }

  function setToken(t) {
    token = t;
    try { t ? sessionStorage.setItem("memomoji-admin", t) : sessionStorage.removeItem("memomoji-admin"); } catch {}
  }

  function showLogin(text = "") {
    $("adminCard").hidden = true;
    $("logout").hidden = true;
    $("loginCard").hidden = false;
    $("loginMsg").textContent = text;
    $("pw").focus();
  }

  function showAdmin() {
    $("loginCard").hidden = true;
    $("adminCard").hidden = false;
    $("logout").hidden = false;
    renderTabs();
    load();
  }

  $("loginForm").onsubmit = async ev => {
    ev.preventDefault();
    $("loginMsg").textContent = "";
    try {
      const d = await api("login", { method: "POST", body: { password: $("pw").value } });
      $("pw").value = "";
      setToken(d.token);
      showAdmin();
    } catch (e) {
      $("loginMsg").textContent = e.message;
    }
  };

  $("logout").onclick = async () => {
    try { await api("logout", { method: "POST", body: {} }); } catch {}
    setToken(null);
    showLogin();
  };

  function renderTabs() {
    $("tabs").replaceChildren(...LEVELS.map(l => {
      const b = document.createElement("button");
      b.textContent = `${l.name} (${l.pairs * 2})`;
      b.setAttribute("aria-pressed", String(l === level));
      b.onclick = () => { level = l; renderTabs(); load(); };
      return b;
    }));
  }

  function say(text, err = false) {
    $("msg").textContent = text;
    $("msg").className = "msg" + (err ? " err" : "");
  }

  async function load() {
    try {
      const d = await api("scores?level=" + level.pairs);
      scores = d.scores;
      render();
    } catch (e) {
      if (token) say(e.message, true);
    }
  }

  const fmtDate = new Intl.DateTimeFormat("de-DE", { dateStyle: "short", timeStyle: "short" });

  function render() {
    const f = $("filter").value.trim().toLowerCase();
    const shown = f ? scores.filter(s => s.name.toLowerCase().includes(f)) : scores;
    $("deleteName").disabled = !f;
    $("deleteName").textContent = f
      ? `Alle Einträge mit genau dem Namen „${$("filter").value.trim()}“ löschen (alle Stufen)`
      : "Alle Einträge eines Namens löschen";
    say(`${shown.length} von ${scores.length} Einträgen auf „${level.name}“`);
    $("rows").replaceChildren(...shown.map(s => {
      const tr = document.createElement("tr");
      const cells = [
        [String(scores.indexOf(s) + 1), "num"],
        [s.name, "name"],
        [(s.ms / 1000).toFixed(1) + " s", "num"],
        [fmtDate.format(new Date(s.created * 1000)), "date"],
      ];
      for (const [text, cls] of cells) {
        const td = document.createElement("td");
        td.textContent = text;
        if (cls) td.className = cls;
        tr.append(td);
      }
      const td = document.createElement("td");
      td.className = "num";
      const b = document.createElement("button");
      b.className = "danger";
      b.textContent = "Löschen";
      b.onclick = async () => {
        if (!confirm(`Eintrag von „${s.name}“ (${(s.ms / 1000).toFixed(1)} s) löschen?`)) return;
        try {
          await api("scores/" + s.id, { method: "DELETE" });
          scores = scores.filter(x => x !== s);
          render();
        } catch (e) { say(e.message, true); }
      };
      td.append(b);
      tr.append(td);
      return tr;
    }));
  }

  $("filter").oninput = render;

  $("deleteName").onclick = async () => {
    const name = $("filter").value.trim();
    if (!name || !confirm(`Wirklich ALLE Einträge mit dem Namen „${name}“ auf allen Stufen löschen?`)) return;
    try {
      const d = await api("delete-name", { method: "POST", body: { name } });
      await load();
      say(`${d.deleted} Einträge von „${name}“ gelöscht.`);
    } catch (e) { say(e.message, true); }
  };

  token ? showAdmin() : showLogin();
})();
</script>
</body>
</html>
